<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Bingo - Live Realtime Game Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .bingo-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .bingo-cell.marked {
            background-color: #f59e0b !important;
            color: #0f172a !important;
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header Section -->
    <header class="w-full max-w-md bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-amber-400 tracking-wider">AZ BINGO 🎲</h1>
            <p class="text-xs text-slate-400" id="room-info">Room: #101 | Realtime Multiplayer</p>
        </div>
        <div id="user-info" class="text-xs bg-slate-800 px-3 py-1.5 rounded-full text-amber-300 font-medium border border-slate-700">
            Connecting...
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md flex flex-col gap-4 my-auto py-2">
        
        <!-- Game Status & Timer Banner -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center shadow-lg relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 to-yellow-300"></div>
            <p id="game-status" class="text-base font-bold text-amber-300 uppercase tracking-wide">Waiting for players...</p>
            <div id="timer" class="text-3xl font-black text-white mt-1 tracking-widest">--:--</div>
        </div>

        <!-- Current Called Number Display -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-900 border border-slate-800 p-6 rounded-2xl text-center shadow-xl flex flex-col items-center justify-center">
            <span class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Current Called Number</span>
            <div id="current-number" class="text-7xl font-black text-amber-400 mt-2 drop-shadow-[0_0_15px_rgba(245,158,11,0.3)]">-</div>
        </div>

        <!-- Bingo Card Grid Section -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
            <!-- Table Header (B-I-N-G-O) -->
            <div class="grid grid-cols-5 gap-2 text-center font-black text-amber-400 text-lg mb-2 pb-2 border-b border-slate-800">
                <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
            </div>
            <!-- Dynamic 5x5 Card Grid -->
            <div class="grid grid-cols-5 gap-2 text-center" id="bingo-card">
                <!-- Javascript will inject 25 cells here -->
            </div>
        </div>

        <!-- Action / Claim Bingo Button -->
        <button id="bingo-btn" onclick="claimBingo()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-600 hover:to-yellow-500 text-slate-950 font-black py-4 rounded-2xl shadow-lg shadow-amber-500/20 transition-all duration-200 uppercase tracking-wider text-lg active:scale-95">
            BINGO! 🎉
        </button>
    </main>

    <!-- Footer Information -->
    <footer class="w-full max-w-md text-center text-xs text-slate-600 pt-2">
        <p>AZ Bingo Secure Gaming Platform &copy; 2026</p>
    </footer>

    <!-- Game Logic Script -->
    <script>
        const socket = io();
        
        // Telegram WebApp Integration
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('user-info').innerText = `@${user.username || user.first_name}`;
                socket.emit('set-user', { id: user.id, username: user.username, name: user.first_name });
            }
        }

        // Generate 5x5 Bingo Card Locally with Random Range Logic
        function generateCard() {
            const cardContainer = document.getElementById('bingo-card');
            cardContainer.innerHTML = '';
            
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell bg-slate-800 border border-slate-700/60 rounded-xl text-white';
                
                if (i === 12) {
                    cell.innerText = 'FREE';
                    cell.classList.add('marked', 'font-bold', 'text-amber-300');
                } else {
                    cell.innerText = Math.floor(Math.random() * 75) + 1;
                    cell.onclick = () => {
                        cell.classList.toggle('marked');
                    };
                }
                cardContainer.appendChild(cell);
            }
        }

        // Initialize Card on Load
        generateCard();

        // Socket Event Listeners for Real-time Game Sync
        socket.on('game-update', (data) => {
            if(data.status) document.getElementById('game-status').innerText = data.status;
            if(data.currentNumber) document.getElementById('current-number').innerText = data.currentNumber;
            if(data.timer) document.getElementById('timer').innerText = data.timer;
        });

        function claimBingo() {
            socket.emit('claim-bingo', { userId: tg?.initDataUnsafe?.user?.id });
            alert('Bingo claim submitted! Verifying card...');
        }
    </script>
</body>
</html>
