<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Bingo 777 - Pro Multiplayer</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            background: #131b2e;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .title { font-size: 18px; font-weight: bold; color: #f39c12; }
        #connection-status { font-size: 11px; padding: 4px 8px; border-radius: 20px; background: #e74c3c; }
        .connected { background: #2ecc71 !important; }

        .wallet-box {
            width: 100%;
            max-width: 400px;
            background: #131b2e;
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .status-box {
            width: 100%;
            max-width: 400px;
            background: #131b2e;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 10px;
        }
        .called-number { font-size: 32px; font-weight: bold; color: #f39c12; margin-top: 2px; }

        /* Split Grids for Dual Cards */
        .cards-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }
        .card-section {
            background: #131b2e;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card-title { font-size: 13px; font-weight: bold; color: #f39c12; margin-bottom: 5px; text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .cell {
            background: #1a233a;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #2a3b5e;
        }
        .cell.marked { background: #f39c12; color: #0b0f19; }

        .bingo-btn {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #0b0f19;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            margin-bottom: 10px;
        }
        
        #overlay-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <div id="overlay-modal">
        <h2 style="color: #f39c12;">AZ BINGO 777</h2>
        <p id="modal-text">Waiting for players to join... Game starts in <span id="countdown-timer">60</span>s</p>
        <button onclick="startGameAdmin()" style="background:#2ecc71; border:none; padding:10px 20px; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer; margin-top:10px;">Start Game Now (Admin)</button>
    </div>

    <div class="header">
        <div>
            <div class="title">AZ BINGO 777 🎲</div>
            <div style="font-size: 10px; color: #888;">Multiplayer Pro Room</div>
        </div>
        <div id="connection-status">Connecting...</div>
    </div>

    <div class="wallet-box">
        <div>Balance: <span id="user-balance" style="color: #2ecc71; font-weight: bold;">100 ETB</span></div>
        <div>
            <button onclick="requestAction('deposit')" style="background:#2ecc71; border:none; padding:5px 10px; border-radius:6px; color:#fff; cursor:pointer; font-weight:bold; font-size:11px;">Deposit</button>
            <button onclick="requestAction('withdraw')" style="background:#e74c3c; border:none; padding:5px 10px; border-radius:6px; color:#fff; cursor:pointer; font-weight:bold; font-size:11px;">Withdraw</button>
        </div>
    </div>

    <div class="status-box">
        <div style="font-size: 12px; color: #aaa;">CURRENT CALLED NUMBER</div>
        <div class="called-number" id="current-number">--</div>
    </div>

    <!-- Dual Split Bingo Cards -->
    <div class="cards-container">
        <div class="card-section">
            <div class="card-title">CARD 1</div>
            <div class="grid" id="grid-1"></div>
        </div>
        <div class="card-section">
            <div class="card-title">CARD 2</div>
            <div class="grid" id="grid-2"></div>
        </div>
    </div>

    <button class="bingo-btn" onclick="declareBingo()">BINGO! 🎉</button>

    <script>
        const socket = io();
        const statusEl = document.getElementById('connection-status');
        const currentNumEl = document.getElementById('current-number');
        const modalEl = document.getElementById('overlay-modal');
        const modalText = document.getElementById('modal-text');
        
        let username = "Player_" + Math.floor(Math.random() * 1000);
        let phone = "+251900000000";
        let balance = 100;

        socket.on('connect', () => {
            statusEl.innerText = 'Connected';
            statusEl.classList.add('connected');
            socket.emit('joinRoom', { roomId: '101', username, phone });
        });

        socket.on('disconnect', () => {
            statusEl.innerText = 'Disconnected';
            statusEl.classList.remove('connected');
        });

        socket.on('countdownUpdate', (time) => {
            document.getElementById('countdown-timer').innerText = time;
        });

        socket.on('gameStartingSequence', () => {
            let count = 3;
            modalText.style.fontSize = "28px";
            modalText.style.color = "#f39c12";
            let seq = setInterval(() => {
                if (count > 0) {
                    modalText.innerText = count;
                    count--;
                } else if (count === 0) {
                    modalText.innerText = "GO! 🚀";
                    count--;
                } else {
                    clearInterval(seq);
                    modalEl.style.display = 'none';
                }
            }, 1000);
        });

        socket.on('numberCalled', (num) => {
            currentNumEl.innerText = num;
        });

        socket.on('bingoWinner', (msg) => {
            alert(msg);
            modalEl.style.display = 'flex';
            modalText.innerText = msg;
        });

        function startGameAdmin() {
            socket.emit('startCountdown', '101');
        }

        function requestAction(type) {
            let amount = prompt(`Enter amount to ${type} (ETB):`, "50");
            if (amount) {
                socket.emit('financialRequest', { type, amount, username, phone });
                alert(`${type} request sent to Admin Telegram Bot!`);
            }
        }

        // Generate Dual Bingo Grids
        function generateGrid(gridId, numbers) {
            const gridEl = document.getElementById(gridId);
            numbers.forEach((val) => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerText = val;
                if (val === 'FREE') {
                    cell.classList.add('marked');
                } else {
                    cell.addEventListener('click', () => {
                        cell.classList.toggle('marked');
                    });
                }
                gridEl.appendChild(cell);
            });
        }

        generateGrid('grid-1', [12, 24, 33, 41, 55, 7, 18, 29, 45, 60, 3, 15, 'FREE', 51, 68, 9, 22, 37, 49, 72, 11, 28, 40, 58, 74]);
        generateGrid('grid-2', [5, 19, 31, 44, 61, 14, 21, 38, 48, 65, 2, 16, 'FREE', 53, 70, 8, 25, 39, 52, 73, 10, 27, 42, 59, 75]);

        function declareBingo() {
            socket.emit('declareBingo', { roomId: '101', username });
        }
    </script>
</body>
</html>
