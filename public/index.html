<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ Games - Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; background-color: #0b0317; color: white; }

        @keyframes softBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); box-shadow: 0 0 25px rgba(245, 158, 11, 0.7); }
        }
        .blink-card { animation: softBlink 1.6s infinite ease-in-out; }

        @keyframes activePress {
            0% { transform: scale(1); }
            50% { transform: scale(0.97); }
            100% { transform: scale(1); }
        }
        .press-effect:active { animation: activePress 0.2s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center p-2">

    <!-- ስክሪኑን ሞላ ብሎ የሚያሳይ ዋና ኮንቴይነር -->
    <div class="w-full max-w-[480px] min-h-screen bg-gradient-to-b from-[#1c0c33] via-[#120624] to-[#0a0216] flex flex-col justify-between p-4 shadow-2xl relative overflow-y-auto">
        
        <!-- Top Header with AZ Games Branding & Bingo Graphic -->
        <div class="flex flex-col items-center text-center space-y-3 pt-4">
            <div class="w-24 h-24 rounded-3xl p-1 bg-gradient-to-br from-amber-400 to-orange-600 shadow-2xl flex items-center justify-center border-2 border-amber-300/60 overflow-hidden">
                <img src="/1000005278.png" alt="AZ Bingo Graphic" class="w-full h-full object-cover rounded-2xl">
            </div>
            <div>
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-amber-200 to-purple-300 tracking-wide">AZ Games Lobby</h1>
                <p id="welcome-user-text" class="text-xs text-gray-300 mt-1 font-medium">ሰላም! መጫወት የሚፈልጉትን ጨዋታ ይምረጡ።</p>
            </div>
        </div>

        <!-- Games Cards Section (እያንዳንዱ ጨዋታ የራሱ ትክክለኛ ግራፊክስ ያለው) -->
        <div class="flex flex-col space-y-4 w-full my-auto py-4">
            
            <!-- 1. AZ Bingo Card (ቢንጎን የሚገልጽ ሪሊስቲክ ግራፊክስ)[span_2](start_span)[span_2](end_span) -->
            <div onclick="enterBingo()" class="blink-card press-effect relative bg-gradient-to-r from-[#1f0d36] via-[#2d144f] to-[#1f0d36] border-2 border-amber-500/70 rounded-2xl p-4 flex items-center justify-between shadow-2xl cursor-pointer hover:border-amber-400 transition-all">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-xl overflow-hidden border border-amber-400/50 shadow-lg flex-shrink-0 bg-black/50">
                        <img src="/1000005278.png" alt="AZ Bingo" class="w-full h-full object-cover">
                    </div>
                    <div class="text-left space-y-0.5">
                        <div class="font-black text-amber-400 text-lg tracking-wide">AZ Bingo</div>
                        <div class="text-xs text-gray-200 font-medium">ባለብዙ ተጫዋች የቢንጎ ማጫወቻ</div>
                        <div class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>አሁን በመጫወት ላይ ይገኛል</span>
                        </div>
                    </div>
                </div>
                <div class="bg-gradient-to-r from-amber-500 to-orange-600 text-white font-black text-xs px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-1.5 flex-shrink-0">
                    <span>ግባ</span>
                    <span class="text-sm">➔</span>
                </div>
            </div>

            <!-- 2. AZ Keno Card (ኬኖን የሚገልጽ ሪሊስቲክ ግራፊክስ)[span_3](start_span)[span_3](end_span) -->
            <div class="relative bg-gradient-to-r from-[#180a29] via-[#220e3a] to-[#180a29] border border-purple-500/40 rounded-2xl p-4 flex items-center justify-between shadow-xl opacity-90">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-xl overflow-hidden border border-purple-500/50 shadow-lg flex-shrink-0 bg-black/50">
                        <img src="/1000005407.png" alt="AZ Keno" class="w-full h-full object-cover">
                    </div>
                    <div class="text-left space-y-0.5">
                        <div class="font-black text-gray-200 text-lg">AZ Keno</div>
                        <div class="text-xs text-gray-300 font-medium">ፈጣን እና አስደሳች የኬኖ ጨዋታ</div>
                        <div class="text-[10px] text-amber-300 font-bold">⏳ በቅርብ ቀን የሚመጣ</div>
                    </div>
                </div>
                <div class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-black px-3 py-2 rounded-xl uppercase tracking-wider flex-shrink-0">
                    Coming Soon
                </div>
            </div>

        </div>

        <!-- Footer Info -->
        <div class="text-center text-[10px] text-gray-400 pt-2 pb-1 border-t border-white/5">
            AZ Games Platform © 2026 • All Rights Reserved
        </div>

    </div>

    <script>
        let tgUser = null;
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser.first_name) {
                    document.getElementById('welcome-user-text').innerHTML = `ሰላም <b>${tgUser.first_name}</b>! መጫወት የሚፈልጉትን ጨዋታ ይምረጡ።`;
                }
            }
        }

        function enterBingo() {
            if (tgUser) {
                let params = new URLSearchParams({
                    id: tgUser.id || '',
                    name: tgUser.first_name || 'ተጫዋች',
                    username: tgUser.username ? '@' + tgUser.username : 'guest'
                });
                window.location.href = `/bingo?${params.toString()}`;
            } else {
                window.location.href = '/bingo';
            }
        }
    </script>
</body>
</html>
