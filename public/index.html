<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ Bingo - Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="min-h-screen bg-[#0b0317] text-white flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-[430px] bg-gradient-to-b from-[#1c0c33] via-[#120624] to-[#0a0216] border border-white/10 rounded-2xl p-6 shadow-2xl text-center space-y-6">
        <div class="w-20 h-20 bg-amber-500/20 border border-amber-400/50 rounded-full flex items-center justify-center mx-auto text-3xl shadow-lg">
            🎰
        </div>
        <div>
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-amber-200 to-purple-300">AZ Bingo</h1>
            <p id="welcome-user-text" class="text-xs text-gray-300 mt-1">ሰላም! ወደ ባለብዙ ተጫዋች የቢንጎ ጨዋታ እንኳን ደህና መጡ።</p>
        </div>

        <button onclick="enterGame()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg hover:opacity-90 transition-all">
            🎮 ወደ ጨዋታው ግባ
        </button>
    </div>

    <script>
        let tgUser = null;
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser.first_name) {
                    document.getElementById('welcome-user-text').innerHTML = `ሰላም <b>${tgUser.first_name}</b>! ወደ ጨዋታው ለመግባት ከታች ይጫኑ።`;
                }
            }
        }

        function enterGame() {
            // የቴሌግራም መረጃዎችን ይዞ ወደ ቢንጎ ገጽ እንዲያልፍ ማድረግ
            if (tgUser) {
                let params = new URLSearchParams({
                    id: tgUser.id || '',
                    name: tgUser.first_name || 'ተጫዋች',
                    username: tgUser.username ? '@' + tgUser.username : 'guest'
                });
                window.location.href = `/bingo?${params.toString()}`;
            } else {
                window.location.href = '/bingo';
            }
        }
    </script>
</body>
</html>
