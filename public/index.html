<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ Games - Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; background-color: #0b0317; color: white; }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center p-4">

    <div class="w-full max-w-[430px] bg-gradient-to-b from-[#1c0c33] via-[#120624] to-[#0a0216] border border-white/10 rounded-2xl p-6 shadow-2xl text-center space-y-6">
        
        <div class="w-20 h-20 bg-amber-500/20 border border-amber-400/50 rounded-full flex items-center justify-center mx-auto text-3xl shadow-lg">
            🎰
        </div>
        
        <div>
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-amber-200 to-purple-300">AZ Games Lobby</h1>
            <p id="welcome-user-text" class="text-xs text-gray-300 mt-1">ሰላም! መጫወት የሚፈልጉትን ጨዋታ ይምረጡ።</p>
        </div>

        <!-- ጨዋታዎችን መምረጫ ቦክሶች -->
        <div class="space-y-3 pt-2">
            <!-- 1. AZ Bingo (ንቁ ጨዋታ) -->
            <button onclick="enterBingo()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-lg hover:opacity-90 transition-all flex items-center justify-between border border-amber-400/30">
                <div class="flex items-center gap-3">
                    <span class="text-xl">🎱</span>
                    <div class="text-left">
                        <div class="font-extrabold text-sm">AZ Bingo</div>
                        <div class="text-[10px] text-amber-100 font-normal">ባለብዙ ተጫዋች የቢንጎ ጨዋታ</div>
                    </div>
                </div>
                <span class="text-xs bg-black/30 px-2.5 py-1 rounded-lg text-amber-300 font-bold">ግባ ➔</span>
            </button>

            <!-- 2. Keno (Coming Soon) -->
            <div class="w-full bg-purple-950/40 border border-purple-500/20 rounded-xl p-3.5 flex items-center justify-between opacity-75 cursor-not-allowed">
                <div class="flex items-center gap-3">
                    <span class="text-xl">⚡</span>
                    <div class="text-left">
                        <div class="font-bold text-sm text-gray-300">Keno</div>
                        <div class="text-[10px] text-gray-400">ፈጣን የኬኖ ጨዋታ</div>
                    </div>
                </div>
                <span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-lg font-bold uppercase tracking-wider">Coming Soon</span>
            </div>
        </div>

    </div>

    <script>
        let tgUser = null;
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser.first_name) {
                    document.getElementById('welcome-user-text').innerHTML = `ሰላም <b>${tgUser.first_name}</b>! መጫወት የሚፈልጉትን ጨዋታ ይምረጡ።`;
                }
            }
        }

        function enterBingo() {
            if (tgUser) {
                let params = new URLSearchParams({
                    id: tgUser.id || '',
                    name: tgUser.first_name || 'ተጫዋች',
                    username: tgUser.username ? '@' + tgUser.username : 'guest'
                });
                window.location.href = `/bingo?${params.toString()}`;
            } else {
                window.location.href = '/bingo';
            }
        }
    </script>
</body>
</html>
