<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ Games Hub - Front Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; background-color: #0b0f19; color: white; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="w-full max-w-[430px] h-full bg-[#101421] flex flex-col justify-between shadow-2xl relative overflow-hidden p-4">
        <div class="flex justify-between items-center py-3 border-b border-white/5 z-20 shrink-0">
            <div class="text-xs font-bold text-gray-300">AZ Games Hub</div>
            <div class="text-sm font-black text-amber-400 tracking-wider">AZEM</div>
            <div class="text-gray-400 text-sm">⋮</div>
        </div>
        <div class="flex-1 flex flex-col justify-center space-y-4 my-auto">
            <div class="space-y-1">
                <h2 class="text-sm font-bold text-gray-200">ጨዋታ ይምረጡ</h2>
                <p class="text-[11px] text-gray-400">መጫወት የሚፈልጉትን ጨዋታ ይምረጡ</p>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="openBingoGame()" class="bg-[#181f33] rounded-2xl overflow-hidden border border-white/5 flex flex-col justify-between cursor-pointer hover:border-amber-400/50 transition group shadow-lg">
                    <div class="h-32 bg-gradient-to-br from-purple-900 via-indigo-950 to-black p-3 relative flex items-center justify-center">
                        <span class="absolute top-2 left-2 text-[8px] font-bold bg-amber-500 text-black px-1.5 py-0.5 rounded">AZ ORIGINAL</span>
                        <div class="text-3xl">🎯</div>
                        <div class="absolute bottom-2 right-2 w-7 h-7 rounded-full bg-[#c7ff44] text-black flex items-center justify-center text-xs font-bold shadow group-hover:scale-110 transition-transform">▶</div>
                    </div>
                    <div class="p-3">
                        <div class="text-xs font-bold text-white group-hover:text-amber-400 transition">AZ Bingo</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">ክፍል ይምረጡ። ዙሩን ይቀላቀሉ።</div>
                    </div>
                </div>
                <div onclick="openKenoComingSoon()" class="bg-[#181f33] rounded-2xl overflow-hidden border border-white/5 flex flex-col justify-between cursor-pointer hover:border-blue-400/50 transition group shadow-lg opacity-85">
                    <div class="h-32 bg-gradient-to-br from-blue-950 via-indigo-900 to-black p-3 relative flex items-center justify-center">
                        <span class="absolute top-2 left-2 text-[8px] font-bold bg-blue-500 text-white px-1.5 py-0.5 rounded">COMING SOON</span>
                        <div class="text-3xl">🎲</div>
                        <div class="absolute bottom-2 right-2 w-7 h-7 rounded-full bg-gray-700 text-gray-300 flex items-center justify-center text-xs font-bold shadow">⏳</div>
                    </div>
                    <div class="p-3">
                        <div class="text-xs font-bold text-white group-hover:text-blue-400 transition">AZ Keno</div>
                        <div class="text-[10px] text-amber-400 mt-0.5 font-medium">በቅርቡ ይለቀቃል...</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center py-2 shrink-0">
            <span class="text-[10px] text-gray-500 font-mono">AZEM Games System © 2026</span>
        </div>
    </div>
    <script>
        function openBingoGame() { window.location.href = '/bingo'; }
        function openKenoComingSoon() { alert("⏳ AZ Keno ጨዋታ ገና በግንባታ ላይ ነው። በቅርቡ ይለቀቃል!"); }
    </script>
</body>
</html>
